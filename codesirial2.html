
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Serial Generator By JP</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 25px #0003;
    text-align: center;
}

h2 {
    color: #333;
    margin-bottom: 20px;
}

.code-box {
    background: #f3f4f6;
    border: 2px dashed #a78bfa;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.serial-code {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #4c1d95;
    font-family: monospace;
}

.counter {
    margin: 15px 0;
    color: #555;
    font-weight: bold;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.generate {
    background: #6d28d9;
    color: white;
}

.copy {
    background: #e5e7eb;
    color: #333;
}

.download {
    background: #059669;
    color: white;
}

.copyall {
    background: #2563eb;
    color: white;
}

.clear {
    background: #dc2626;
    color: white;
}

button:hover {
    opacity: .85;
}

.history {
    margin-top: 22px;
    text-align: left;
}

.history h3 {
    margin-bottom: 10px;
    color: #333;
}

#codeList {
    max-height: 220px;
    overflow-y: auto;
    background: #f9fafb;
    border-radius: 8px;
    padding: 10px;
}

.code-item {
    padding: 9px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: monospace;
    font-weight: bold;
    color: #4c1d95;
}

.code-item button {
    padding: 5px 9px;
    background: #e5e7eb;
}

.note {
    font-size: 12px;
    color: #777;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <h2>Student Serial Generator By JP</h2>

    <div class="code-box">
        <span id="serialCode" class="serial-code">XXX-XXX</span>
    </div>

    <div class="btn-group">
        <button class="generate" onclick="generateCode()">Generate</button>
        <button class="copy" onclick="copyCode()">Copy Code</button>
        <button class="copyall" onclick="copyAll()">Copy All</button>
        <button class="download" onclick="downloadCodes()">Download TXT</button>
    </div>

    <div class="counter">
        Total Generated: <span id="total">0</span>
    </div>

    <div class="history">
        <h3>Generated Serial List</h3>
        <div id="codeList"></div>
    </div>

    <br>
    <button class="clear" onclick="clearCodes()">Clear All Codes</button>

    <p class="note">
        All generated serial numbers are saved in this browser.
    </p>

</div>

<script>

// Load saved codes
let codes = JSON.parse(
    localStorage.getItem("studentSerials") || "[]"
);

let currentCode = "XXX-XXX";

// Save codes
function saveCodes() {
    localStorage.setItem(
        "studentSerials",
        JSON.stringify(codes)
    );
}

// Generate unique code
function generateCode() {

    if (codes.length >= 1000000) {
        alert("All possible serial numbers have been used!");
        return;
    }

    let newCode;

    do {
        let first = Math.floor(Math.random() * 1000)
            .toString().padStart(3, "0");

        let second = Math.floor(Math.random() * 1000)
            .toString().padStart(3, "0");

        newCode = first + "-" + second;

    } while (codes.includes(newCode));

    codes.push(newCode);

    currentCode = newCode;

    saveCodes();
    renderList();

    document.getElementById("serialCode").innerText = newCode;
}

// Render list
function renderList() {

    document.getElementById("total").innerText = codes.length;

    const list = document.getElementById("codeList");

    list.innerHTML = "";

    codes.slice().reverse().forEach(code => {

        const item = document.createElement("div");
        item.className = "code-item";

        const span = document.createElement("span");
        span.textContent = code;

        const button = document.createElement("button");
        button.textContent = "Copy";

        button.onclick = () => copyText(code);

        item.appendChild(span);
        item.appendChild(button);

        list.appendChild(item);
    });
}

// Copy text
async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        alert("Copied: " + text);
    } catch {
        alert("Copy failed! Please use HTTPS.");
    }
}

// Copy current code
function copyCode() {
    if (!codes.includes(currentCode)) {
        alert("Please generate a code first!");
        return;
    }
    copyText(currentCode);
}

// Copy all codes
function copyAll() {
    if (codes.length === 0) {
        alert("No codes available!");
        return;
    }
    copyText(codes.join("\n"));
}

// Download TXT
function downloadCodes() {

    if (codes.length === 0) {
        alert("No codes available!");
        return;
    }

    const blob = new Blob(
        [codes.join("\n")],
        { type: "text/plain" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Student-Serial-Codes.txt";
    a.click();

    URL.revokeObjectURL(url);
}

// Clear all codes
function clearCodes() {

    if (!confirm("Are you sure you want to delete ALL serial codes?")) {
        return;
    }

    codes = [];
    currentCode = "XXX-XXX";

    saveCodes();

    document.getElementById("serialCode").innerText = currentCode;

    renderList();
}

// Initial load
renderList();

</script>

</body>
</html>
